// Convert your sourcePlaces into GeoJSON
const geojson = {
    type: "FeatureCollection",
    features: sourcePlaces.map(place => ({

        type: "Feature",

        properties: {
    borough: place.name,
    label: mappings[currentMapping][place.name].label
},

        geometry: {
            type: "Polygon",
            coordinates: [[
                ...place.pt.map(([lat,lng]) => [lng,lat])
            ]]
        }

    }))
};


const map = new maplibregl.Map({

    container: "map",

    style: "https://tiles.openfreemap.org/styles/liberty",

    center: [-0.11,51.50],

    zoom: 9

});

map.addControl(new maplibregl.NavigationControl());


map.on("load",()=>{

    // Hide every label in the basemap

    map.getStyle().layers.forEach(layer=>{

        if(layer.type==="symbol"){

            map.setLayoutProperty(layer.id,"visibility","none");

        }

    });


    map.addSource("boroughs",{

        type:"geojson",

        data:geojson

    });


    map.addLayer({

        id:"borough-fill",

        type:"fill",

        source:"boroughs"

    });


    map.addLayer({

        id:"borough-outline",

        type:"line",

        source:"boroughs",

        paint:{
            "line-color":"#333",
            "line-width":2
        }

    });


    // Label polygons with the state names
    map.addLayer({

        id:"borough-label",

        type:"symbol",

        source:"boroughs",

        layout:{

            "symbol-placement":"point",

            "text-field":["get","label"],

            "text-font":["Noto Sans Bold"],

            "text-size":14,

            "text-allow-overlap":true

        },

        paint:{

            "text-color":"#000",

            "text-halo-color":"white",

            "text-halo-width":2

        }

    });


    function updateMapping() {

    geojson.features.forEach(feature => {

        const borough = feature.properties.borough;

        feature.properties.label =
            mappings[currentMapping][borough].label;

    });

    map.getSource("boroughs").setData(geojson);

}

    updateMapping();
    
    map.on("click","borough-fill",(e)=>{

    const borough = e.features[0].properties.borough;
    const info = mappings[currentMapping][borough];

document.getElementById("info").innerHTML = `
<h2>${borough}</h2>
<h3>${info.label}</h3>
<p>${info.reason}</p>
`;

    
});


    map.on("mouseenter","borough-fill",()=>{

        map.getCanvas().style.cursor="pointer";

    });

    map.on("mouseleave","borough-fill",()=>{

        map.getCanvas().style.cursor="";

    });

});

    

   

document.getElementById("toggle").onclick = () => {

    currentMapping =
        currentMapping === "usa"
        ? "europe"
        : "usa";

    document.getElementById("toggle").textContent =
        currentMapping === "usa"
        ? "🌍 Europe"
        : "🇺🇸 USA";

    updateMapping();




};
